[package]
name = "mdv"
version = "0.1.0"
edition = "2021"
description = "Visualizador de Markdown no terminal (renderizador + TUI)"

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.29"
syntect = { version = "5", default-features = false, features = ["parsing", "default-syntaxes", "default-themes", "regex-fancy"] }
unicode-width = "0.2"

[profile.release]
lto = true
strip = true
overflow-checks = true
