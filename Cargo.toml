[workspace]
members = [".", "crates/mdv-text", "crates/mdv-tools", "crates/mdv-export", "crates/mdv-msg", "crates/mdv-html"]
resolver = "2"

[workspace.package]
version = "0.7.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
pulldown-cmark = { version = "0.13", default-features = false }
tempfile = "3"
mdv-text = { path = "crates/mdv-text" }
mdv-export = { path = "crates/mdv-export" }
mdv-msg = { path = "crates/mdv-msg" }
mdv-html = { path = "crates/mdv-html" }

[package]
name = "mdv"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Visualizador de Markdown no terminal (renderizador + TUI)"

[dependencies]
pulldown-cmark.workspace = true
mdv-text.workspace = true
mdv-export.workspace = true
mdv-msg.workspace = true
mdv-html.workspace = true
encoding_rs = "0.8"
tempfile.workspace = true
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
syntect = { version = "5", default-features = false, features = ["parsing", "default-syntaxes", "default-themes", "regex-fancy"] }
unicode-width = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ureq = { version = "2", default-features = false, features = ["tls"], optional = true }
url = { version = "2", optional = true }
serde_json = { version = "1", features = ["preserve_order"] }
csv = "1"
saphyr-parser = "0.3.3"
mermaid-rs-renderer = { version = "0.3.1", default-features = false, optional = true }
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts"], optional = true }

[features]
default = ["images", "mermaid", "remote"]
# `image` não é opcional: `images` existe só para `mermaid`/`remote` dependerem dela (decisão da fase 6).
images = []
mermaid = ["images", "dep:mermaid-rs-renderer", "dep:resvg"]
remote = ["images", "dep:ureq", "dep:url"]

[dev-dependencies]
tempfile.workspace = true
mdv-msg = { workspace = true, features = ["testutil"] }
unicode-width = "0.2"

[profile.release]
lto = "thin"
strip = true
overflow-checks = true

# Distribuição: LTO completo e uma única unidade de codegen (mais lento de compilar, binário menor).
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

[package.metadata.generate-rpm]
assets = [
    { source = "target/dist/mdv", dest = "/usr/bin/mdv", mode = "755" },
    { source = "target/dist/mdv-tools", dest = "/usr/bin/mdv-tools", mode = "755" },
]

[package.metadata.deb]
maintainer = "Lisbao <flisbao@gmail.com>"
assets = [
    ["target/dist/mdv", "usr/bin/", "755"],
    ["target/dist/mdv-tools", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/mdv/README", "644"],
]

# Build rápido para testar à mão: `cargo run --profile fast -- sample.md`.
# Sem LTO e com compilação incremental; o `release` continua completo para distribuição.
[profile.fast]
inherits = "release"
lto = false
incremental = true
codegen-units = 256
