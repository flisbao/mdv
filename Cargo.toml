[package]
name = "mdv"
version = "0.4.4"
edition = "2021"
license = "MIT"
description = "Visualizador de Markdown no terminal (renderizador + TUI)"

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.30"
syntect = { version = "5", default-features = false, features = ["parsing", "default-syntaxes", "default-themes", "regex-fancy"] }
unicode-width = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
url = "2"
tempfile = "3"
serde_json = { version = "1", features = ["preserve_order"] }
csv = "1"
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts"] }

[profile.release]
lto = true
strip = true
overflow-checks = true

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/mdv", dest = "/usr/bin/mdv", mode = "755" },
]

# Build rápido para testar à mão: `cargo run --profile fast -- sample.md`.
# Sem LTO e com compilação incremental; o `release` continua completo para distribuição.
[profile.fast]
inherits = "release"
lto = false
incremental = true
codegen-units = 256
