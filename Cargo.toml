[workspace]
members = [".", "crates/mdv-text", "crates/mdv-tools"]
resolver = "2"

[workspace.package]
version = "0.4.4"
edition = "2021"
license = "MIT"

[workspace.dependencies]
pulldown-cmark = { version = "0.13", default-features = false }
tempfile = "3"
mdv-text = { path = "crates/mdv-text" }

[package]
name = "mdv"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Visualizador de Markdown no terminal (renderizador + TUI)"

[dependencies]
pulldown-cmark.workspace = true
mdv-text.workspace = true
ratatui = "0.30"
syntect = { version = "5", default-features = false, features = ["parsing", "default-syntaxes", "default-themes", "regex-fancy"] }
unicode-width = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ureq = { version = "2", default-features = false, features = ["tls"], optional = true }
url = { version = "2", optional = true }
serde_json = { version = "1", features = ["preserve_order"] }
csv = "1"
mermaid-rs-renderer = { version = "0.3.1", default-features = false, optional = true }
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts"], optional = true }

[features]
default = ["images", "mermaid", "remote"]
# `image` não é opcional: `images` existe só para `mermaid`/`remote` dependerem dela (decisão da fase 6).
images = []
mermaid = ["images", "dep:mermaid-rs-renderer", "dep:resvg"]
remote = ["images", "dep:ureq", "dep:url"]

[dev-dependencies]
tempfile.workspace = true

[profile.release]
lto = true
strip = true
overflow-checks = true

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/mdv", dest = "/usr/bin/mdv", mode = "755" },
    { source = "target/release/mdv-tools", dest = "/usr/bin/mdv-tools", mode = "755" },
]

[package.metadata.deb]
assets = [
    ["target/release/mdv", "usr/bin/", "755"],
    ["target/release/mdv-tools", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/mdv/README", "644"],
]

# Build rápido para testar à mão: `cargo run --profile fast -- sample.md`.
# Sem LTO e com compilação incremental; o `release` continua completo para distribuição.
[profile.fast]
inherits = "release"
lto = false
incremental = true
codegen-units = 256
