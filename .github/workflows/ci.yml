name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Testes
        run: cargo test --release --workspace

      - name: Testes sem features
        run: cargo test --release --workspace --no-default-features

      - name: Saída plain do sample
        shell: bash
        run: cargo run --release -- -p -w 60 sample.md

      - name: mdv-tools sobre o sample
        shell: bash
        run: cargo run --release -p mdv-tools -- check-links sample.md
