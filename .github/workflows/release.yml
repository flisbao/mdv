name: release

on:
  push:
    tags: ["v*"]
  # Ensaio manual: roda os builds e deixa os artefatos na execução, sem publicar release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc do runner define o piso de compatibilidade: 22.04 => glibc 2.35 (Ubuntu 22.04+, Debian 12+, Fedora 36+).
          - name: linux-x86_64
            runner: ubuntu-22.04
            musl: false
            pkg: true
          - name: linux-aarch64
            runner: ubuntu-22.04-arm
            musl: false
            pkg: true
          # Binário estático: roda em qualquer distro Linux x86_64, inclusive Alpine.
          - name: linux-x86_64-musl
            runner: ubuntu-22.04
            musl: true
            pkg: false
          # macos-latest é arm64 (Apple Silicon).
          - name: macos-aarch64
            runner: macos-latest
            musl: false
            pkg: false
          # Cruzamento a partir do runner arm64; o binário roda via Rosetta.
          - name: macos-x86_64
            runner: macos-latest
            musl: false
            pkg: false
            target: x86_64-apple-darwin
          - name: windows-x86_64
            runner: windows-latest
            musl: false
            pkg: false
            windows: true
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.musl && 'x86_64-unknown-linux-musl' || matrix.target || '' }}

      - name: Instalar musl-tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build (musl, estático)
        if: matrix.musl
        run: |
          cargo build --profile dist --workspace --target x86_64-unknown-linux-musl
          echo "BIN=target/x86_64-unknown-linux-musl/dist/mdv" >> "$GITHUB_ENV"
          echo "TOOLS=target/x86_64-unknown-linux-musl/dist/mdv-tools" >> "$GITHUB_ENV"

      - name: Build (cruzado)
        if: ${{ matrix.target }}
        run: |
          cargo build --profile dist --workspace --target "${{ matrix.target }}"
          echo "BIN=target/${{ matrix.target }}/dist/mdv" >> "$GITHUB_ENV"
          echo "TOOLS=target/${{ matrix.target }}/dist/mdv-tools" >> "$GITHUB_ENV"

      - name: Build
        if: ${{ !matrix.musl && !matrix.target }}
        run: |
          cargo build --profile dist --workspace
          if [ "${{ matrix.windows }}" = "true" ]; then
            echo "BIN=target/dist/mdv.exe" >> "$GITHUB_ENV"
            echo "TOOLS=target/dist/mdv-tools.exe" >> "$GITHUB_ENV"
          else
            echo "BIN=target/dist/mdv" >> "$GITHUB_ENV"
            echo "TOOLS=target/dist/mdv-tools" >> "$GITHUB_ENV"
          fi

      - name: Instalar cargo-deb e cargo-generate-rpm
        if: matrix.pkg
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Gerar .deb e .rpm
        if: matrix.pkg
        run: |
          cargo deb --no-build --profile dist
          cargo generate-rpm --profile dist

      - name: Empacotar (tar.gz)
        if: ${{ !matrix.windows }}
        run: |
          mkdir -p dist
          stage="mdv-${GITHUB_REF_NAME//\//-}-${{ matrix.name }}"
          mkdir "$stage"
          cp "$BIN" "$TOOLS" README.md "$stage/"
          tar -czf "dist/$stage.tar.gz" "$stage"
          if [ "${{ matrix.pkg }}" = "true" ]; then
            cp target/debian/*.deb target/generate-rpm/*.rpm dist/
          fi

      - name: Empacotar (zip)
        if: ${{ matrix.windows }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $stage = "mdv-$($env:GITHUB_REF_NAME -replace '/', '-')-${{ matrix.name }}"
          New-Item -ItemType Directory $stage | Out-Null
          Copy-Item $env:BIN, $env:TOOLS, README.md $stage
          Compress-Archive -Path $stage -DestinationPath "dist/$stage.zip"

      # Prova que o arquivo publicado extrai e executa, não só que o build terminou.
      - name: Testar binário empacotado
        run: |
          mkdir smoke
          if [ "${{ matrix.windows }}" = "true" ]; then
            7z x dist/*.zip -osmoke > /dev/null
            exe=$(ls smoke/mdv-*/mdv.exe)
            tools=$(ls smoke/mdv-*/mdv-tools.exe)
          else
            tar -xzf dist/*.tar.gz -C smoke
            exe=$(ls smoke/mdv-*/mdv)
            tools=$(ls smoke/mdv-*/mdv-tools)
          fi
          printf '# Olá\n\n- item\n' | "$exe" -p - | grep -q "Olá"
          printf '# Olá\n' | "$tools" section "Olá" - | grep -q "Olá"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publicar release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Gerar SHA256SUMS
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Criar release
        run: |
          notes_file=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [[ -f "$notes_file" ]]; then
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file "$notes_file"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
          fi

  # Regenera os blocos gerados do README (links da versão e `mdv --help`) e commita no main.
  readme:
    name: atualizar README
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: dist

      - name: Extrair binário publicado
        run: |
          mkdir bin
          tar -xzf dist/*.tar.gz -C bin
          echo "MDV=$(ls "$PWD"/bin/mdv-*/mdv)" >> "$GITHUB_ENV"

      - name: Atualizar README
        run: scripts/update-readme.sh "$GITHUB_REF_NAME" "$MDV"

      - name: Commitar
        run: |
          if git diff --quiet README.md; then
            echo "README já está atualizado"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs(readme): atualizar para $GITHUB_REF_NAME"
          git push origin HEAD:main
